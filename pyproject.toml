[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
version = "0.1.0"
description = "An LLM inference engine built from scratch: paged KV cache, continuous batching, speculative decoding, Metal kernels."
requires-python = ">=3.10"
dependencies = [
    "torch", "safetensors", "tokenizers", "huggingface_hub", "jinja2",
    "fastapi", "uvicorn", "prometheus_client",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy", "transformers", "openai", "httpx"]

[project.scripts]
kiln = "kiln.cli:main"

[tool.setuptools.packages.find]
include = ["kiln*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode in docs/tests is intentional

[tool.mypy]
ignore_missing_imports = true
